<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vivenzorto — Gestionale</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="admin">

<header class="site-header">
  <a class="logo" href="admin.html"><span aria-hidden="true">🛠️</span> Gestionale Vivenzorto</a>
  <div class="head-actions">
    <a class="btn-ghost" href="index.html">Vetrina ↗</a>
    <button id="logout" class="btn-danger" type="button">Esci</button>
  </div>
</header>

<main class="admin-wrap">

  <!-- Login -->
  <section id="gate" class="gate card">
    <h2>Area riservata</h2>
    <p class="muted">Inserisci la password per gestire prodotti e prenotazioni.</p>
    <form id="login-form">
      <label>Password <input id="pass" type="password" required></label>
      <button class="btn-primary big" type="submit">Accedi</button>
      <p class="hint">Demo: password <code>admin</code></p>
    </form>
  </section>

  <!-- Pannello -->
  <div id="panel" class="hidden">

    <section id="alerts" aria-label="Avvisi scorte"></section>

    <section class="card">
      <h2>📋 Prenotazioni</h2>
      <div id="orders"></div>
    </section>

    <section class="card">
      <h2 id="form-title">➕ Nuovo prodotto</h2>
      <form id="p-form">
        <div class="f-grid">
          <label>Emoji <input name="emoji" maxlength="4" placeholder="🥬"></label>
          <label>Prezzo €/kg <input name="price" type="number" step="0.10" min="0.10" required></label>
          <label class="full">Nome prodotto <input name="name" required></label>
          <label class="full">Descrizione <input name="desc" required></label>
          <label>Disponibilità (kg) <input name="available" type="number" step="0.5" min="0" required></label>
          <label>Allerta se sotto (kg) <input name="threshold" type="number" step="0.5" min="0" required></label>
        </div>
        <div class="f-actions">
          <button class="btn-primary" type="submit">Salva prodotto</button>
          <button class="btn-ghost hidden" id="cancel-edit" type="button">Annulla modifica</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>🥬 Prodotti</h2>
      <div id="plist"></div>
    </section>

  </div>
</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="admin.js"></script>
</body>
</html>
